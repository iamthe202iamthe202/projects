    document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'x') {
            event.preventDefault(); // Prevent default cut action

            const selection = window.getSelection();
            if (!selection || selection.isCollapsed || selection.rangeCount === 0) return;
            const range = selection.getRangeAt(0);

            const startVerseElement = findAncestorWithClass(range.startContainer, 'verse');
            const endVerseElement = findAncestorWithClass(range.endContainer, 'verse');

            if (!startVerseElement || !endVerseElement) return;

            let textToCopy = '';

            if (paragraphMode) {
                let versesToCopyContent = [];
                let firstVerseNumberInSelection = null;
                let lastVerseNumberInSelection = null;

                // Get all paragraph elements involved in the selection
                const allParagraphElements = Array.from(versiculosDiv.querySelectorAll('.verse.paragraph'));
                const startParagraphIndex = allParagraphElements.indexOf(startVerseElement);
                const endParagraphIndex = allParagraphElements.indexOf(endVerseElement);

                // Track if all verses of a single paragraph are selected
                let allVersesInSingleParagraphSelected = false;

                // If selection is within a single paragraph
                if (startParagraphIndex === endParagraphIndex) {
                    const versePartsInCurrentParagraph = Array.from(startVerseElement.querySelectorAll('.verse-content-part'));
                    let selectedVersePartsCount = 0;

                    versePartsInCurrentParagraph.forEach(versePart => {
                        const versePartRange = document.createRange();
                        versePartRange.selectNodeContents(versePart);

                        if (range.intersectsNode(versePart)) {
                            versesToCopyContent.push(versePart.textContent.trim());
                            selectedVersePartsCount++;

                            const verseNumberSpan = versePart.querySelector('.verse-number');
                            if (verseNumberSpan) {
                                const currentVerseNum = parseInt(verseNumberSpan.textContent);
                                if (firstVerseNumberInSelection === null || currentVerseNum < firstVerseNumberInSelection) {
                                    firstVerseNumberInSelection = currentVerseNum;
                                }
                                if (lastVerseNumberInSelection === null || currentVerseNum > lastVerseNumberInSelection) {
                                    lastVerseNumberInSelection = currentVerseNum;
                                }
                            }
                        }
                    });

                    // Check if all verses in this single paragraph were selected
                    if (selectedVersePartsCount === versePartsInCurrentParagraph.length) {
                        allVersesInSingleParagraphSelected = true;
                    }

                } else { // Selection spans multiple paragraphs
                    for (let i = startParagraphIndex; i <= endParagraphIndex; i++) {
                        const currentParagraphElement = allParagraphElements[i];
                        const versePartsInCurrentParagraph = Array.from(currentParagraphElement.querySelectorAll('.verse-content-part'));

                        versePartsInCurrentParagraph.forEach(versePart => {
                            const versePartRange = document.createRange();
                            versePartRange.selectNodeContents(versePart);

                            if (range.intersectsNode(versePart)) {
                                versesToCopyContent.push(versePart.textContent.trim());

                                const verseNumberSpan = versePart.querySelector('.verse-number');
                                if (verseNumberSpan) {
                                    const currentVerseNum = parseInt(verseNumberSpan.textContent);
                                    if (firstVerseNumberInSelection === null || currentVerseNum < firstVerseNumberInSelection) {
                                        firstVerseNumberInSelection = currentVerseNum;
                                    }
                                    if (lastVerseNumberInSelection === null || currentVerseNum > lastVerseNumberInSelection) {
                                        lastVerseNumberInSelection = currentVerseNum;
                                    }
                                }
                            }
                        });
                    }
                }

                // Determine the actual text to copy based on the condition
                if (allVersesInSingleParagraphSelected && startParagraphIndex === endParagraphIndex) {
                    // If all verses in a single paragraph are selected, copy the *entire paragraph's* textContent
                    // This includes all formatting within the paragraph itself.
                    textToCopy = startVerseElement.textContent.trim(); // Take the full paragraph text
                    // Need to re-extract the actual verse numbers for the reference if we just took the whole textContent
                    const verseNumberSpansInFullParagraph = Array.from(startVerseElement.querySelectorAll('.verse-number'));
                    if (verseNumberSpansInFullParagraph.length > 0) {
                        firstVerseNumberInSelection = parseInt(verseNumberSpansInFullParagraph[0].textContent);
                        lastVerseNumberInSelection = parseInt(verseNumberSpansInFullParagraph[verseNumberSpansInFullParagraph.length - 1].textContent);
                    } else {
                         // Fallback if no verse numbers found (shouldn't happen with valid structure)
                         firstVerseNumberInSelection = startVerseElement.dataset.startVerse;
                         lastVerseNumberInSelection = startVerseElement.dataset.endVerse;
                    }

                } else {
                    // Otherwise, copy only the intersected verse parts
                    textToCopy = versesToCopyContent.join(' ').trim();
                }


                // Determine the reference
                const firstParagraphData = startVerseElement.dataset;
                const lastParagraphData = endVerseElement.dataset;

                let chapterToRef = firstParagraphData.chapter;
                let verseRangeRef = '';

                if (firstVerseNumberInSelection && lastVerseNumberInSelection) {
                    verseRangeRef = (firstVerseNumberInSelection === lastVerseNumberInSelection) ?
                                    `${firstVerseNumberInSelection}` :
                                    `${firstVerseNumberInSelection}-${lastVerseNumberInSelection}`;
                } else {
                    // Fallback if no specific verses were found in selection
                    // This case should ideally not happen if `versesToCopyContent` is not empty.
                    // It might mean the `verse-content-part` logic failed to find verse numbers.
                    // As a robust fallback, if no verses are explicitly copied, use the paragraph's overall verse range.
                    if (firstParagraphData.startVerse && lastParagraphData.endVerse) {
                         verseRangeRef = (firstParagraphData.startVerse === lastParagraphData.endVerse) ?
                                         `${firstParagraphData.startVerse}` :
                                         `${firstParagraphData.startVerse}-${lastParagraphData.endVerse}`;
                    } else {
                         verseRangeRef = 'seleção';
                    }
                }

                const bookNameRef = firstParagraphData.bookName;
                let bookAbbreviationRef = bookNameRef;
                if (currentLanguage === 'pt' && ptBookNameToAbbreviation[normalizeBookName(bookNameRef)]) {
                    bookAbbreviationRef = ptBookNameToAbbreviation[normalizeBookName(bookNameRef)];
                } else if (currentLanguage === 'en' && enBookNameToAbbreviation[normalizeBookName(bookNameRef)]) {
                    bookAbbreviationRef = enBookNameToAbbreviation[normalizeBookName(bookNameRef)];
                }

                textToCopy = `"${textToCopy}" ${bookAbbreviationRef} ${chapterToRef}:${verseRangeRef}`;

            } else { // Verse Mode (existing logic)
                let versesToCopy = [];
                const allContentVerses = Array.from(versiculosDiv.querySelectorAll('.verse'));
                const startIndex = allContentVerses.indexOf(startVerseElement);
                const endIndex = allContentVerses.indexOf(endVerseElement);

                if (startIndex !== -1 && endIndex !== -1 && startIndex <= endIndex) {
                    versesToCopy = allContentVerses.slice(startIndex, endIndex + 1);
                } else if (startVerseElement) {
                    versesToCopy = [startVerseElement];
                }

                textToCopy = versesToCopy.map(vDiv => {
                    let text = '';
                    const verseContentElement = vDiv.querySelector('.verse-content');
                    if (verseContentElement) {
                        for (const node of verseContentElement.childNodes) {
                            if (node.nodeType === Node.TEXT_NODE) {
                                text += node.textContent;
                            } else if (node.nodeType === Node.ELEMENT_NODE && !node.classList.contains('verse-number')) {
                                text += node.textContent;
                            }
                        }
                    }
                    return text.trim();
                }).join(' ');

                const firstVerseData = versesToCopy[0].dataset;
                const lastVerseData = versesToCopy[versesToCopy.length - 1].dataset;

                const startV = firstVerseData.verseNumber;
                const endV = lastVerseData.verseNumber;
                const verseRange = (startV === endV) ? `${startV}` : `${startV}-${endV}`;

                const bookName = firstVerseData.bookName;
                let bookAbbreviation = bookName;
                if (currentLanguage === 'pt' && ptBookNameToAbbreviation[normalizeBookName(bookName)]) {
                    bookAbbreviation = ptBookNameToAbbreviation[normalizeBookName(bookName)];
                } else if (currentLanguage === 'en' && enBookNameToAbbreviation[normalizeBookName(bookName)]) {
                    bookAbbreviation = enBookNameToAbbreviation[normalizeBookName(bookName)];
                }

                textToCopy = `"${textToCopy}" ${bookAbbreviation} ${firstVerseData.chapter}:${verseRange}`;
            }

            // Use document.execCommand('copy') for better iframe compatibility
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            try {
                document.execCommand('copy');
                logDebugMessage(`[keydown] Copied to clipboard using execCommand: "${textToCopy}"`, 'info');
            } catch (err) {
                logDebugMessage(`[keydown] Erro ao copiar usando execCommand: ${err.message}`, 'error');
            } finally {
                document.body.removeChild(tempTextArea);
            }
        }
    });

    /**
     * Waits for a specific book (by its normalized name in the target language) to be present in the target language's data.
     * @param {string} normalizedBookNameForLookup The normalized book name (e.g., "Genesis", "Tiago", "James") to look for.
     * @param {string} language The language context ('pt' or 'en') for which to check the data.
     * @param {number} timeout The maximum time to wait in milliseconds.
     * @param {number} interval The interval between checks in milliseconds.
     * @returns {Promise<boolean>} A promise that resolves to true if the book is found, or rejects if a timeout occurs.
     */
    async function waitForBookInList(normalizedBookNameForLookup, language, timeout = 5000, interval = 50) {
        const startTime = Date.now();
        logDebugMessage(`[waitForBookInList] Called with normalizedBookNameForLookup: "${normalizedBookNameForLookup}", language: "${language}"`, 'debug');

        return new Promise((resolve, reject) => {
            const checkInterval = setInterval(() => {
                let currentBibleDataForCheck = (language === 'pt') ? bibliaData : englishBibliaData;
                let bookListForCheck = [];
                if (currentBibleDataForCheck && currentBibleDataForCheck.length > 0) {
                    bookListForCheck = [...new Set(currentBibleDataForCheck.map(v => v.book_name))]; // These are already normalized for their language
                }

                logDebugMessage(`[waitForBookInList - check] Language param: "${language}". Checking for book normalized: "${normalizedBookNameForLookup}". Data length for param language: ${currentBibleDataForCheck.length}. Derived book list (first 5): ${JSON.stringify(bookListForCheck.slice(0, 5))}... (length: ${bookListForCheck.length}). Full derived book list: ${JSON.stringify(bookListForCheck)}`, 'debug');

                if (currentBibleDataForCheck && currentBibleDataForCheck.length > 0 && bookListForCheck.includes(normalizedBookNameForLookup)) {
                    clearInterval(checkInterval);
                    logDebugMessage(`[waitForBookInList] Book "${normalizedBookNameForLookup}" found in derived book list for ${language} after ${Date.now() - startTime}ms.`, 'success');
                    resolve(true);
                } else if (Date.now() - startTime > timeout) {
                    clearInterval(checkInterval);
                    logDebugMessage(`[waitForBookInList] Timeout waiting for book "${normalizedBookNameForLookup}" in derived book list for ${language}. Current 'livros' array (global, original names): ${JSON.stringify(livros.slice(0, 5))}... (length: ${livros.length}). Full global 'livros' array: ${JSON.stringify(livros)}`, 'error'); // More detailed error log
                    logDebugMessage(`[waitForBookInList] Derived book list for ${language} (normalized, first 5): ${JSON.stringify(bookListForCheck.slice(0, 5))}... (length: ${bookListForCheck.length}). Full derived book list: ${JSON.stringify(bookListForCheck)}`, 'error'); // More detailed error log
                    reject(new Error(`Timeout waiting for book "${normalizedBookNameForLookup}" in list.`));
                }
            }, interval);
        });
    }

    languageToggleButton.addEventListener('click', async () => {
        if (isLanguageToggling) {
            logDebugMessage('[languageToggleButton] Already toggling language, ignoring click.', 'warn');
            return;
        }
        isLanguageToggling = true; // Set flag
        logDebugMessage('--- Language Toggle Start ---', 'event');
        languageToggleButton.disabled = true; // Disable the button immediately

        // livroAtual holds the original accented name from the previous language
        logDebugMessage(`[languageToggleButton] START OF TOGGLE: livroAtual (original name) = "${livroAtual}"`, 'debug');
        logDebugMessage(`[languageToggleButton] START OF TOGGLE: activeTabId = "${activeTabId}"`, 'debug');

        let savedLivroAtualOriginalName = livroAtual ? livroAtual.trim() : null;
        let savedChapter = livroState[livroAtual]?.currentChapter;
        let savedScrollTop = conteudoDiv.scrollTop;
        let savedParagraphMode = paragraphMode;

        const previousLanguage = currentLanguage;
        const targetLanguage = (currentLanguage === 'pt') ? 'en' : 'pt';

        logDebugMessage(`[languageToggleButton] DEBUG: savedLivroAtualOriginalName: "${savedLivroAtualOriginalName}"`, 'debug');
        logDebugMessage(`[languageToggleButton] DEBUG: previousLanguage: "${previousLanguage}"`, 'debug');
        logDebugMessage(`[languageToggleButton] DEBUG: targetLanguage: "${targetLanguage}"`, 'debug');

        // Translate book names in abertoTabs (which store original names)
        abertoTabs.forEach(tab => {
            if (previousLanguage === 'pt') {
                tab.book = originalPtBookNameToOriginalEnBookName[tab.book] || tab.book;
            } else {
                tab.book = originalEnBookNameToOriginalPtBookName[tab.book] || tab.book;
            }
        });
        logDebugMessage(`[languageToggleButton] abiertoTabs after translation (original names): ${JSON.stringify(abertoTabs)}`, 'debug');

        // Translate keys in livroState (which are original names)
        const newLivroState = {};
        for (const bookName in livroState) {
            let translatedBookNameOriginal;
            if (previousLanguage === 'pt') {
                translatedBookNameOriginal = originalPtBookNameToOriginalEnBookName[bookName] || bookName;
            } else { // previousLanguage === 'en'
                // This is the problematic path: EN -> PT
                translatedBookNameOriginal = originalEnBookNameToOriginalPtBookName[bookName] || bookName;
                logDebugMessage(`[languageToggleButton] DEBUG: EN->PT translation for "${bookName}" resulted in "${translatedBookNameOriginal}"`, 'debug');
                // Add a direct check for the key's existence in the map
                if (!(bookName in originalEnBookNameToOriginalPtBookName)) {
                    logDebugMessage(`[languageToggleButton] CRITICAL: "${bookName}" NOT FOUND as a key in originalEnBookNameToOriginalPtBookName!`, 'critical');
                    logDebugMessage(`[languageToggleButton] Keys in originalEnBookNameToOriginalPtBookName (first 50): ${Object.keys(originalEnBookNameToOriginalPtBookName).slice(0, 50).join(', ')}...`, 'critical');
                }
            }
            // If translation fails, use the original name from before translation
            if (!translatedBookNameOriginal) {
                translatedBookNameOriginal = bookName;
                logDebugMessage(`[languageToggleButton] Translation for "${bookName}" failed or returned undefined. Using original as fallback.`, 'warn');
            }
            newLivroState[translatedBookNameOriginal] = { ...livroState[bookName] };
        }
        // Clear old state and assign new translated state
        for (const key in livroState) { delete livroState[key]; }
        Object.assign(livroState, newLivroState);
        logDebugMessage(`[languageToggleButton] livroState after translation (original names as keys): ${JSON.stringify(livroState)}`, 'debug');


        currentLanguage = targetLanguage;
        languageToggleButton.textContent = (currentLanguage === 'pt') ? 'EN' : 'PT';
        logDebugMessage(`[languageToggleButton] Idioma alterado para: ${currentLanguage}`, 'info');

        updateLivrosList(currentLanguage); // This populates 'livros' based on 'currentLanguage' (the NEW one) and uses original_book_name
        logDebugMessage(`[languageToggleButton] 'livros' array updated immediately after language change. Current 'livros' count: ${livros.length}`, 'debug');


        // Restore paragraph mode state
        paragraphMode = savedParagraphMode;
        modeToggleButton.textContent = (currentLanguage === 'pt') ? (paragraphMode ? 'Modo Versículo' : 'Modo Parágrafo') : (paragraphMode ? 'Verse Mode' : 'Paragraph Mode');
        logDebugMessage(`[languageToggleButton] Paragraph mode button text updated.`, 'debug');

        // Update UI texts (placeholders, button texts, titles)
        searchInput.placeholder = currentLanguage === 'pt' ? "Buscar na Bíblia..." : "Search the Bible...";
        modalSearchInput.placeholder = currentLanguage === 'pt' ? "Nova busca..." : "New search...";
        searchButton.textContent = (currentLanguage === 'pt') ? 'Buscar' : 'Search';
        modalSearchButton.textContent = (currentLanguage === 'pt') ? 'Buscar' : 'Search';

        filterNtButton.textContent = currentLanguage === 'pt' ? 'No Novo Testamento' : 'New Testament';
        filterOtButton.textContent = currentLanguage === 'pt' ? 'No Antigo Testamento' : 'Old Testament';
        filterAllButton.textContent = currentLanguage === 'pt' ? 'Na Bíblia Toda' : 'Entire Bible';
        const favoritosTitle = document.querySelector('#favoritos h4');
        if (favoritosTitle) {
            favoritosTitle.textContent = currentLanguage === 'pt' ? 'Abertos' : 'Open';
        }

        copyrightInfoDiv.textContent = (currentLanguage === 'pt') ? 'Bíblia King James 1611 - Acesse bkjfiel.com.br' : 'King James Bible - biblehub.com/kjv/genesis/1.htm';

        filterOtBooksButton.textContent = currentLanguage === 'pt' ? 'AT' : 'OT';
        filterNtBooksButton.textContent = 'NT';

        // Re-display books list for the new language
        exibirLivros(currentBookFilter, currentLanguage);

        // Update open tabs panel for desktop
        let isDesktop = window.matchMedia('(min-width: 769px)').matches; // Alterado de const para let
        if (isDesktop) {
           atualizarPainelAbertos();
        }

        // NOVO: Chame updateMainHeading para garantir que o título principal seja atualizado
        updateMainHeading(null, null); // Reset para o título padrão antes de tentar reabrir o livro

        let translatedSavedLivroAtualOriginalName = null;
        if (savedLivroAtualOriginalName) {
            logDebugMessage(`[languageToggleButton] DEBUG: savedLivroAtualOriginalName before translation attempt: "${savedLivroAtualOriginalName}" (length: ${savedLivroAtualOriginalName.length})`, 'debug');
            if (previousLanguage === 'pt') {
                translatedSavedLivroAtualOriginalName = originalPtBookNameToOriginalEnBookName[savedLivroAtualOriginalName];
            } else { // previousLanguage === 'en'
                // This is the problematic path: EN -> PT
                translatedSavedLivroAtualOriginalName = originalEnBookNameToOriginalPtBookName[savedLivroAtualOriginalName];
                logDebugMessage(`[languageToggleButton] DEBUG: Result of originalEnBookNameToOriginalPtBookName["${savedLivroAtualOriginalName}"]: "${translatedSavedLivroAtualOriginalName}"`, 'debug');
                // Add a direct check for the key's existence in the map
                if (!(savedLivroAtualOriginalName in originalEnBookNameToOriginalPtBookName)) {
                    logDebugMessage(`[languageToggleButton] CRITICAL: "${savedLivroAtualOriginalName}" NOT FOUND as a key in originalEnBookNameToOriginalPtBookName!`, 'critical');
                    logDebugMessage(`[languageToggleButton] Keys in originalEnBookNameToOriginalPtBookName (first 50): ${Object.keys(originalEnBookNameToOriginalPtBookName).slice(0, 50).join(', ')}...`, 'critical');
                }
            }
            // If translation fails, use the original name from before translation
            if (!translatedSavedLivroAtualOriginalName) {
                translatedSavedLivroAtualOriginalName = savedLivroAtualOriginalName;
                logDebugMessage(`[languageToggleButton] Translation for "${savedLivroAtualOriginalName}" failed or returned undefined. Using original as fallback.`, 'warn');
            }
        } else {
            logDebugMessage(`[languageToggleButton] No savedLivroAtual to translate.`, 'debug');
        }

        // For waitForBookInList, we need the normalized name of the translated book
        const normalizedTranslatedSavedLivroAtual = translatedSavedLivroAtualOriginalName ? normalizeBookName(translatedSavedLivroAtualOriginalName.trim()) : null; // Trim here

        logDebugMessage(`[languageToggleButton] BEFORE waitForBookInList: normalizedBookNameForLookup="${normalizedTranslatedSavedLivroAtual}", currentLanguage="${currentLanguage}".`, 'critical');

        try {
            if (translatedSavedLivroAtualOriginalName) {
                // Increased delay to ensure data and UI are settled
                await new Promise(resolve => setTimeout(resolve, 200));
                // Wait for the normalized version of the translated book to be in the list of normalized book names
                await waitForBookInList(normalizedTranslatedSavedLivroAtual, currentLanguage, 10000, 100); // Increased timeout and interval
                logDebugMessage(`[languageToggleButton] Reabrindo livro salvo no centro: ${translatedSavedLivroAtualOriginalName} Capítulo: ${savedChapter}`, 'info');
                const targetTab = abertoTabs.find(tab => tab.book === translatedSavedLivroAtualOriginalName && tab.chapter === savedChapter);
                await abrirLivroNoCentro(translatedSavedLivroAtualOriginalName, savedChapter, 'language-toggle', targetTab ? targetTab.id : null, true, null);

                setTimeout(() => {
                    if (conteudoDiv) {
                        conteudoDiv.scrollTop = savedScrollTop;
                        logDebugMessage(`[languageToggleButton] Restored scroll position for re-opened book: ${savedScrollTop}`, 'info');
                    }
                }, 100);
            } else {
                logDebugMessage(`[languageToggleButton] Livro salvo (${savedLivroAtualOriginalName} -> ${translatedSavedLivroAtualOriginalName}) não encontrado ou não traduzível. Exibindo mensagem inicial.`, 'warn');
                initialMessageDiv.classList.remove('hidden');
                capitulosContainer.classList.add('hidden');
                versiculosDiv.classList.add('hidden'); // Use global versiculosDiv
                livroAtual = null;
                activeTabId = null;
                languageToggleButton.disabled = false;
            }
        } catch (error) {
            logDebugMessage(`[languageToggleButton] Error during book re-opening after language toggle: ${error.message}`, 'error');
            initialMessageDiv.classList.remove('hidden');
            capitulosContainer.classList.add('hidden');
            versiculosDiv.classList.add('hidden'); // Use global versiculosDiv
            livroAtual = null;
            activeTabId = null;
            languageToggleButton.disabled = false;
        } finally {
            isLanguageToggling = false;
            logDebugMessage('--- Language Toggle End ---', 'event');
        }
    });

    function findAncestorWithClass(element, className) {
        let currentNode = element;
        if (currentNode && currentNode.nodeType === Node.TEXT_NODE) currentNode = currentNode.parentNode; // Corrected to parentNode
        while (currentNode && currentNode.nodeType === Node.ELEMENT_NODE && !currentNode.classList.contains(className)) {
            currentNode = currentNode.parentNode; // Corrected to parentNode
        }
        return (currentNode && currentNode.nodeType === Node.ELEMENT_NODE && currentNode.classList.contains(className)) ? currentNode : null;
    }

    /**
     * Updates the main heading of the application to show the current book and chapter.
     * @param {string|null} book The current book name. If null, resets to default title.
     * @param {number|null} chapter The current chapter number. If null, resets to default title.
     */
    function updateMainHeading(book, chapter) {
        if (book && chapter) {
            mainHeading.textContent = `${book} ${chapter}`; // Removido "Capítulo"
            mainHeading.classList.add('text-center');
            mainHeading.classList.remove('md:text-left');
        } else {
            mainHeading.textContent = ''; // Define como vazio quando nenhum livro é selecionado
            mainHeading.classList.remove('text-center');
            mainHeading.classList.add('md:text-left');
        }
        logDebugMessage(`[updateMainHeading] Main heading updated to: "${mainHeading.textContent}"`, 'info');
    }

    // A inicialização agora é feita em DOMContentLoaded de forma assíncrona.
  </script>
