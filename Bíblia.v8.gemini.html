    /**
     * Logs a message to the browser's console.
     * Removed debug panel specific logging.
     * @param {string} message The message to log.
     * @param {string} type The type of message (e.g., 'info', 'error', 'event', 'debug', 'warn', 'critical', 'success').
     */
    function logDebugMessage(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const formattedMessage = `[${timestamp}] [${type.toUpperCase()}] ${message.replace(/<\/?strong>/g, '')}`; // Remove HTML tags for console

        // Log to console
        switch (type) {
            case 'info':
                console.info(formattedMessage);
                break;
            case 'error':
            case 'critical':
                console.error(formattedMessage);
                break;
            case 'warn':
                console.warn(formattedMessage);
                break;
            case 'success':
                console.log(`%c${formattedMessage}`, 'color: green; font-weight: bold;');
                break;
            case 'event':
                console.log(`%c${formattedMessage}`, 'color: #87CEFA;'); // Light blue for events
                break;
            case 'debug':
                console.debug(formattedMessage);
                break;
            default:
                console.log(formattedMessage);
        }
    }

    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function buildAccentInsensitiveRegexPattern(term) {
        const replacements = {
            'a': '[aáàãâäa]', 'e': '[eéèêëe]', 'i': '[iíìîîi]',
            'o': '[oóòõôöo]', 'u': '[uúùûûûu]', 'c': '[cçc]',
        };
        let pattern = '';
        for (const char of term.toLowerCase()) {
            pattern += replacements[char] || char;
        }
        return pattern;
    }

    // NOVO: Função para abreviar nomes de livros
    function abbreviateBookName(fullName) {
        // Use o mapeamento correto para o idioma atual
        // Ensure the fullName is normalized before lookup in abbreviation maps
        const normalizedFullName = normalizeBookName(fullName);

        if (currentLanguage === 'pt' && ptBookNameToAbbreviation[normalizedFullName]) {
            return ptBookNameToAbbreviation[normalizedFullName];
        } else if (currentLanguage === 'en' && enBookNameToAbbreviation[normalizedFullName]) {
            return enBookNameToAbbreviation[normalizedFullName];
        }
        return normalizedFullName.substring(0, 4); // Fallback para 4 primeiras letras
    }

            logDebugMessage(`[updateLivrosList] Lista de livros atualizada para ${lang}. Total de livros: ${livros.length}. Primeiros 5 livros: ${JSON.stringify(livros.slice(0, 5))}. Full list: ${JSON.stringify(livros)}`, 'info');
        } else {
            livros = [];
            logDebugMessage(`[updateLivrosList] Dados da Bíblia em ${lang} estão vazios. Lista de livros limpa.`, 'warn');
        }
    }


    async function loadBibleData(language) {
        logDebugMessage(`Attempting to load Bible data for language: ${language} from ${bibleUrls[language]}`, 'info');
        const url = bibleUrls[language];
        // Only show loading indicators if this is the current active language
        if (language === currentLanguage) {
             document.getElementById('versiculos').innerHTML = '<p>Carregando Bíblia...</p>';
             listaLivrosDiv.innerHTML = '<p>Carregando livros...</p>';
             initialMessageDiv.classList.add('hidden');
             capitulosContainer.classList.add('hidden');
             // Spinner is now managed by DOMContentLoaded to ensure all initial loads are done - REMOVED
        }

        try {
            const response = await fetch(url);
            if (!response.ok) {
                logDebugMessage(`Fetch error for ${language}: Status ${response.status}, StatusText: ${response.statusText}, URL: ${url}`, 'error');
                if (response.status === 429) {
                     logDebugMessage(`Rate limit hit for ${language}. Retrying in 0.5 seconds...`, 'warn');
                     await new Promise(resolve => setTimeout(resolve, 500));
                     return loadBibleData(language);
                }
                throw new Error(`Erro ao carregar dados da Bíblia em ${language}: ${response.statusText} (Status: ${response.status})`);
            }
            const data = await response.json();

            if (!Array.isArray(data) || data.length === 0 || (!data[0].book_name && !data[0].book && !data[0].name)) {
                 logDebugMessage(`Invalid or empty JSON data loaded for ${language}. Expected array with book name property.`, 'error');
                 throw new Error(`Dados inválidos ou vazios para ${language}.`);
            }

            // Normalize book names within the loaded data
            const processedData = data.map(verse => {
                let originalBookName = '';
                // Prioritize 'book_name', then 'book', then 'name'
                if (verse.book_name !== undefined) {
                    originalBookName = verse.book_name;
                } else if (verse.book !== undefined) {
                    originalBookName = verse.book;
                } else if (verse.name !== undefined) {
                    originalBookName = verse.name;
                }
                return {
                    ...verse,
                    original_book_name: originalBookName, // Store the original, accented name
                    book_name: normalizeBookName(originalBookName) // Store the normalized name for internal lookups
                };
            });

            if (language === 'pt') {
                bibliaData = processedData;
                logDebugMessage(`Dados da Bíblia em ${language} carregados e normalizados.`, 'success');
            } else if (language === 'en') {
                englishBibliaData = processedData;
                logDebugMessage(`Dados da Bíblia em ${language} carregados e normalizados.`, 'success');
            }

        } catch (error) {
            logDebugMessage(`Erro FATAL ao carregar Bíblia em ${language}: ${error.message}`, 'critical');
            if (language === currentLanguage) { // Only show error on UI if it's the currently active language
                document.getElementById('conteudo').innerHTML = `<p class="text-red-500">Erro ao carregar dados (${language}). Verifique o console para detalhes.</p>`;
                listaLivrosDiv.innerHTML = `<p class="text-red-500">Erro ao carregar livros.</p>`;
            }
            throw error; // Re-throw to propagate the error to DOMContentLoaded or language toggle
        }
        // Removed hideSpinner from here
    }

    async function abrirLivroNoCentro(livro, capitulo, source = 'single-click', tabId = null, restoreScroll = true, scrollToVerseFromSource = null) {
        logDebugMessage(`[abrirLivroNoCentro] START - Attempting to open book: ${livro}, chapter: ${capitulo}, source: ${source}, tabId: ${tabId}, restoreScroll: ${restoreScroll}, scrollToVerse: ${scrollToVerseFromSource}`, 'event');
        logDebugMessage(`[abrirLivroNoCentro] Current state: livroAtual=${livroAtual}, activeTabId=${activeTabId}`, 'debug');

        let currentData = (currentLanguage === 'pt') ? bibliaData : englishBibliaData;
        if (!currentData || currentData.length === 0) {
             logDebugMessage(`[abrirLivroNoCentro] Dados (${currentLanguage}) não carregados. Aborting.`, 'error');
             document.getElementById('conteudo').innerHTML = `<p class="text-red-500">Dados (${currentLanguage}) não disponíveis.</p>`;
             if (source === 'language-toggle' || source === 'tab-click') { // Re-enable button if language toggle or tab click caused this error
                languageToggleButton.disabled = false;
                logDebugMessage(`[abrirLivroNoCentro] Language toggle button re-enabled due to early error.`, 'debug');
            }
             return;
        }
        // NEW LOG: Log the structure of the first item in currentData
        if (currentData.length > 0) {
            logDebugMessage(`[abrirLivroNoCentro] First item in currentData (${currentLanguage}): ${JSON.stringify(currentData[0]).substring(0, 200)}...`, 'debug');
        }


        try {
            initialMessageDiv.classList.add('hidden');
            capitulosContainer.classList.remove('hidden');
            versiculosDiv.classList.remove('hidden'); // Use global versiculosDiv

            // --- Start: Handle saving previous active tab state ---
            if (livroAtual && conteudoDiv && activeTabId !== null) {
                const previousActiveTab = abertoTabs.find(tab => tab.id === activeTabId);
                if (previousActiveTab) {
                    // Save the state of the *previously* active tab
                    previousActiveTab.chapter = livroState[livroAtual]?.currentChapter || 1;
                    previousActiveTab.scrollTop = conteudoDiv.scrollTop;
                    logDebugMessage(`[abrirLivroNoCentro] Saved state for previous active tab (ID: ${activeTabId}, Book: ${livroAtual}). Saved Chapter: ${previousActiveTab.chapter}, ScrollTop: ${previousActiveTab.scrollTop}`, 'debug');
                }
            }
            // --- End: Handle saving previous active tab state ---

            let isDesktop = window.matchMedia('(min-width: 769px)').matches; // Alterado de const para let
            let targetTab = null;
            let chapterToDisplay = capitulo;
            let verseToHighlight = scrollToVerseFromSource; // Use the passed verseToHighlight

            if (isDesktop) {
                if (source === 'double-click' || source === 'search' || source === 'add-to-abertos') { // Added 'add-to-abertos'
                    const newTabId = Date.now();
                    const newTab = { id: newTabId, book: livro, chapter: capitulo, scrollTop: conteudoDiv.scrollTop, scrollToVerse: scrollToVerseFromSource }; // 'livro' is original name, capture current scroll
                    abertoTabs.push(newTab);
                    activeTabId = newTabId;
                    logDebugMessage(`[abrirLivroNoCentro] ${source} source: Added new tab to abertoTabs: ${JSON.stringify(newTab)}`, 'debug');
                    // Removed immediate call to atualizarPainelAbertos here, will be called later
                } else if (source === 'tab-click') {
                    targetTab = abertoTabs.find(tab => tab.id === tabId);
                    if (targetTab) {
                        activeTabId = tabId;
                        chapterToDisplay = targetTab.chapter || 1;
                        verseToHighlight = targetTab.scrollToVerse;
                        logDebugMessage(`[abrirLivroNoCentro] Tab click: Using saved state from tab (ID: ${activeTabId}). Chapter: ${chapterToDisplay}, Verse to Highlight: ${verseToHighlight}`, 'debug');
                        // Removed immediate call to atualizarPainelAbertos here, will be called later
                    } else {
                        logDebugMessage(`[abrirLivroNoCentro] Tab click: Tab with ID ${tabId} not found. Aborting.`, 'error');
                        if (source === 'language-toggle' || source === 'tab-click') { // Re-enable button if language toggle or tab click caused this error
                            languageToggleButton.disabled = false;
                            logDebugMessage(`[abrirLivroNoCentro] Language toggle button re-enabled due to tab not found.`, 'debug');
                        }
                        return;
                    }
                } else if (source === 'nav-button' || source === 'mode-toggle' || source === 'language-toggle' || source === 'initial') {
                    // For these sources, verseToHighlight is passed directly or is null
                } else {
                    activeTabId = null;
                    logDebugMessage(`[abrirLivroNoCentro] Single click on book list. No active tab set.`, 'debug');
                }
            } else { // Mobile
                if (livrosElement.classList.contains('visible-mobile')) {
                    logDebugMessage(`[abrirLivroNoCentro] Mobile detected and book list visible, toggling book list.`, 'debug');
                    toggleBookList();
                }
                activeTabId = null;
            }

            livroAtual = livro; // livroAtual stores the original accented name
            livroState[livro] = livroState[livro] || {}; // Key in livroState is the original accented name
            livroState[livro].currentChapter = chapterToDisplay; // Update the current chapter for this book

            // --- Start: Update the active tab's chapter immediately if it's the current tab ---
            // This block ensures the chapter number in the 'Abertos' panel updates instantly
            if (activeTabId !== null) {
                const currentActiveTab = abertoTabs.find(tab => tab.id === activeTabId);
                if (currentActiveTab) {
                    currentActiveTab.chapter = chapterToDisplay; // Update the chapter in the tab object
                    logDebugMessage(`[abrirLivroNoCentro] Updated chapter for current active tab (ID: ${activeTabId}) to ${chapterToDisplay}.`, 'debug');
                }
            }
            // --- End: Update the active tab's chapter immediately ---

            // Check if the book exists in the current language data using its normalized name
            const bookExistsInCurrentData = currentData.some(v => v.book_name === normalizeBookName(livro));
            logDebugMessage(`[abrirLivroNoCentro] Book "${livro}" (normalized: ${normalizeBookName(livro)}) exists in current ${currentLanguage} data: ${bookExistsInCurrentData}`, 'debug');
            if (!bookExistsInCurrentData) {
                logDebugMessage(`[abrirLivroNoCentro] Book "${livro}" not found in ${currentLanguage} data. Displaying initial message.`, 'warn');
                initialMessageDiv.classList.remove('hidden');
                capitulosContainer.classList.add('hidden');
                versiculosDiv.classList.add('hidden'); // Use global versiculosDiv
                document.getElementById('versiculos').innerHTML = '';
                // Chame updateMainHeading aqui também para resetar o título
                updateMainHeading(null, null);
                pageTitle.textContent = (currentLanguage === 'pt') ? 'Bíblia Interativa' : 'Interactive Bible';
                if (source === 'language-toggle') { // Re-enable button if book not found due to language toggle
                    languageToggleButton.disabled = false;
                    logDebugMessage(`[abrirLivroNoCentro] Language toggle button re-enabled because book "${livro}" not found after toggle.`, 'debug');
                }
                return; // Exit the function early
            }


            logDebugMessage(`[abrirLivroNoCentro] Calling exibirCapitulos for ${livro}`, 'debug');
            try { exibirCapitulos(livro); } catch (e) { logDebugMessage(`[abrirLivroNoCentro] Erro exibir capítulos ${livro}: ${e.message}`, 'error'); capitulosContainer.innerHTML = `<p class="text-red-500">Erro ao exibir capítulos.</p>`; }

            logDebugMessage(`[abrirLivroNoCentro] Calling exibirVersiculos for ${livro}, chapter ${chapterToDisplay} with verseToHighlight: ${verseToHighlight} and restoreScroll: ${restoreScroll}, source: ${source}`, 'debug');
            await exibirVersiculos(livro, chapterToDisplay, verseToHighlight, restoreScroll, source); // AWAIT HERE

            // Atualiza o cabeçalho principal AQUI, após livroAtual e chapterToDisplay estarem definidos
            updateMainHeading(livroAtual, chapterToDisplay);

            // Call atualizarPainelAbertos to re-render the tabs with the updated chapter
            let isDesktop2 = window.matchMedia('(min-width: 769px)').matches; // Alterado de const para let
            if (isDesktop2) {
               atualizarPainelAbertos();
            }

        } catch (e) {
             logDebugMessage(`[abrirLivroNoCentro] Erro geral: ${e.message}`, 'critical');
             document.getElementById('conteudo').innerHTML = `<p class="text-red-500">Erro ao abrir livro.</p>`;
             if (source === 'language-toggle' || source === 'tab-click') { // Re-enable button on general error
                languageToggleButton.disabled = false;
                logDebugMessage(`[abrirLivroNoCentro] Language toggle button re-enabled due to general error.`, 'debug');
            }
        }
    }

    /**
     * Displays the list of books based on the current language and filter.
     * @param {string} filter The filter to apply ('new' for New Testament, 'old' for Old Testament, 'all' for all books).
     * @param {string} lang The language to display books for ('pt' or 'en'). Defaults to currentLanguage.
     */
    function exibirLivros(filter = 'all', lang = currentLanguage) {
      listaLivrosDiv.innerHTML = '';
      let currentLivros = livros; // Use the global 'livros' list, which now contains original names
      try {
          const ntBooksNormalized = newTestamentBooksByLanguage[lang]; // NT book names are normalized
          let livrosFiltrados = [];

          // Filter based on the normalized name of the book
          if (filter === 'new') {
              livrosFiltrados = currentLivros.filter(l => ntBooksNormalized.includes(normalizeBookName(l)));
          } else if (filter === 'old') {
              livrosFiltrados = currentLivros.filter(l => !ntBooksNormalized.includes(normalizeBookName(l)));
          } else {
              livrosFiltrados = currentLivros;
          }


          if (livrosFiltrados.length === 0) {
              listaLivrosDiv.innerHTML = `<p>Nenhum livro encontrado (${filter} em ${lang}).</p>`;
              logDebugMessage(`[exibirLivros] Nenhum livro encontrado para filtro ${filter} em ${lang}.`, 'warn');
          } else {
              logDebugMessage(`[exibirLivros] Exibindo ${livrosFiltrados.length} livros para filtro ${filter} em ${lang}`, 'info');
              livrosFiltrados.forEach(livro => { // 'livro' here is the original accented name
                const div = document.createElement('div');
                div.textContent = livro;
                div.className = 'livro cursor-pointer p-2 rounded-md transition duration-200 ease-in-out';
                div.setAttribute('data-livro', livro); // Store original name in data attribute

                div.addEventListener('mousedown', (event) => {
                    if (event.detail === 2) {
                        event.preventDefault();
                        logDebugMessage(`[exibirLivros] Mousedown (double-click) on book "${livro}". Preventing default selection.`, 'debug');
                    }
                });

                div.addEventListener('click', (event) => {
                    logDebugMessage(`[exibirLivros] Click event on book: ${livro}, detail: ${event.detail}`, 'event');
                    if (event.detail === 2) {
                        event.preventDefault();
                        event.stopPropagation();
                        logDebugMessage(`[exibirLivros] Double click detected on book: "${livro}". Opening book and adding to 'Abertos'.`, 'event');

                        div.classList.add('double-clicked');
                        setTimeout(() => {
                            div.classList.remove('double-clicked');
                        }, 300);

                        abrirLivroNoCentro(livro, 1, 'double-click', null, true, null); // Pass original name
                    } else if (event.detail === 1) {
                         logDebugMessage(`[exibirLivros] Single click detected on book: "${livro}". Opening book in center.`, 'event');
                         abrirLivroNoCentro(livro, 1, 'single-click', null, true, null); // Pass original name
                    }
                });

                listaLivrosDiv.appendChild(div);
              });
          }
          highlightBookFilterButton(filter);
          currentBookFilter = filter;
      } catch (e) {
           logDebugMessage(`[exibirLivros] Erro: ${e.message}`, 'error');
           listaLivrosDiv.innerHTML = `<p class="text-red-500">Erro ao exibir livros.</p>`;
      }
    }

    function highlightBookFilterButton(filter) {
        filterOtBooksButton.classList.remove('active-filter-button');
        filterNtBooksButton.classList.remove('active-filter-button');
        if (filter === 'old') filterOtBooksButton.classList.add('active-filter-button');
        else if (filter === 'new') filterNtBooksButton.classList.add('active-filter-button');
    }

    function exibirCapitulos(livro) { // 'livro' here is the original accented name
      logDebugMessage(`[exibirCapitulos] START - Book: ${livro}`, 'info');
      capitulosContainer.innerHTML = '';
      let currentData = (currentLanguage === 'pt') ? bibliaData : englishBibliaData;
      logDebugMessage(`[exibirCapitulos] currentData available: ${currentData && currentData.length > 0}`, 'debug');
      if (!currentData || currentData.length === 0) {
          capitulosContainer.innerHTML = `<p class="text-red-500">Dados (${currentLanguage}) não disponíveis.</p>`;
          logDebugMessage(`[exibirCapitulos] Dados (${currentLanguage}) não carregados. Aborting.`, 'error');
          return;
      }
      try {
          // Ensure comparison is with normalized book name from the data against the normalized input 'livro'
          const filteredVersesForBook = currentData.filter(v => v.book_name === normalizeBookName(livro));
          logDebugMessage(`[exibirCapitulos] Versículos filtrados para o livro "${livro}" (normalized: ${normalizeBookName(livro)}): ${filteredVersesForBook.length} versículos.`, 'debug');

          const capitulos = [...new Set(filteredVersesForBook.map(v => v.chapter))].sort((a, b) => a - b);
          logDebugMessage(`[exibirCapitulos] Encontrados ${capitulos.length} capítulos para ${livro}`, 'info');
          if (capitulos.length === 0) {
              capitulosContainer.innerHTML = `<p>Nenhum capítulo (${livro} em ${currentLanguage}).</p>`;
              logDebugMessage(`[exibirCapitulos] Nenhum capítulo encontrado para ${livro} em ${currentLanguage}.`, 'warn');

                const span = document.createElement('span');
                span.textContent = capitulo;
                span.className = 'capitulo cursor-pointer px-3 py-1 rounded-full transition duration-200 ease-in-out text-sm';
                span.onclick = () => {
                    const activeTab = abertoTabs.find(tab => tab.id === activeTabId);
                    if (activeTab) {
                         activeTab.scrollToVerse = null;
                         abrirLivroNoCentro(livroAtual, capitulo, 'nav-button', activeTabId, true, null);
                    } else {
                      abrirLivroNoCentro(livroAtual, capitulo, 'nav-button', null, true, null);
                    }
                    logDebugMessage(`[exibirCapitulos] Clicked chapter ${capitulo} for book ${livro}.`, 'event');
                };
                capitulosContainer.appendChild(span);
              });
              logDebugMessage(`[exibirCapitulos] Capítulos exibidos para ${livro}.`, 'info');
          }
      } catch (e) {
           logDebugMessage(`[exibirCapitulos] Erro: ${e.message}`, 'error');
           capitulosContainer.innerHTML = `<p class="text-red-500">Erro ao exibir capítulos.</p>`;
      }
    }

    function groupVersesIntoParagraphs(versesArray) {
        const paragraphs = [];
        let currentParagraph = [];

        versesArray.forEach((verse, index) => {
            const startsNewParagraph = index === 0 || verse.text.includes('<pb/>');

            if (startsNewParagraph && currentParagraph.length > 0) {
                paragraphs.push(currentParagraph);
                currentParagraph = [];
            }
            currentParagraph.push(verse);
        });

        if (currentParagraph.length > 0) {
            paragraphs.push(currentParagraph);
        }
        return paragraphs;
    }

    async function exibirVersiculos(livro, capitulo, verseToHighlight = null, restoreScroll = true, source = 'unknown') { // 'livro' here is the original accented name
      logDebugMessage(`[exibirVersiculos] START - Book: ${livro}, Chapter: ${capitulo}, verseToHighlight: ${verseToHighlight}, restoreScroll: ${restoreScroll}, source: ${source}`, 'info');
      versiculosDiv.innerHTML = '';
      let currentData = (currentLanguage === 'pt') ? bibliaData : englishBibliaData;
      if (!currentData || currentData.length === 0) {
           versiculosDiv.innerHTML = `<p class="text-red-500">Dados (${currentLanguage}) não disponíveis.</p>`;
           logDebugMessage(`[exibirVersiculos] Dados (${currentLanguage}) não carregados. Aborting.`, 'error');
           if (source === 'language-toggle' || source === 'tab-click') { // Re-enable button if language toggle or tab click caused this error
                languageToggleButton.disabled = false;
                logDebugMessage(`[exibirVersiculos] Language toggle button re-enabled due to data not available.`, 'debug');
            }
           return;
      }
      try {
          // Ensure comparison is with normalized book name
          const versiculos = currentData.filter(v => v.book_name === normalizeBookName(livro) && v.chapter === capitulo);
          logDebugMessage(`[exibirVersiculos] Encontrados ${versiculos.length} versículos para ${livro} ${capitulo}. Versículos filtrados: ${JSON.stringify(versiculos.slice(0, 5))}`, 'info'); // Log first 5 verses

          if (versiculos.length === 0) {
              versiculosDiv.innerHTML = `<p>Nenhum versículo encontrado para ${livro} ${capitulo} em ${currentLanguage}.</p>`;
              logDebugMessage(`[exibirVersiculos] Nenhum versículo encontrado para ${livro} ${capitulo} em ${currentLanguage}.`, 'warn');
          } else {

            if (paragraphMode) {
                logDebugMessage(`[exibirVersiculos] Paragraph Mode enabled.`, 'debug');
                const paragraphContainer = document.createElement('div');
                paragraphContainer.className = 'paragraph-mode-container';

                const groupedParagraphs = groupVersesIntoParagraphs(versiculos);

                groupedParagraphs.forEach(paragraphVerses => {
                    if (paragraphVerses.length === 0) return;

                    const firstVerseInParagraph = paragraphVerses[0];
                    const lastVerseInParagraph = paragraphVerses[paragraphVerses.length - 1];

                    const paragraphDiv = document.createElement('div');
                    paragraphDiv.className = 'verse paragraph mb-2 p-3 rounded-lg shadow-sm';
                    paragraphDiv.setAttribute('data-book-name', firstVerseInParagraph.original_book_name); // Store original name
                    paragraphDiv.setAttribute('data-chapter', firstVerseInParagraph.chapter);
                    paragraphDiv.setAttribute('data-start-verse', firstVerseInParagraph.verse);
                    paragraphDiv.setAttribute('data-end-verse', lastVerseInParagraph.verse);

                    paragraphVerses.forEach(pVerse => {
                        let verseTextContent = pVerse.text;
                        verseTextContent = verseTextContent.replace(/<S>.*?<\/S>/gi, '');
                        verseTextContent = verseTextContent.replace(/(\S+?)(\d+)/g, '$1');
                        verseTextContent = verseTextContent.replace(/<J>(.*?)<\/J>/gi, '<span class="text-yellow-j">$1</span>');
                        verseTextContent = verseTextContent.replace(/<pb\/>/gi, '');

                        const verseSpan = document.createElement('span');
                        verseSpan.className = 'verse-content-part';
                        verseSpan.innerHTML = `<span class="verse-number">${pVerse.verse}</span>${verseTextContent.trim()} `;
                        paragraphDiv.appendChild(verseSpan);
                    });

                    paragraphDiv.addEventListener('dblclick', (event) => {
                        if (currentLanguage === 'pt') {
                            const bookNameOriginal = paragraphDiv.getAttribute('data-book-name'); // This is the original name
                            const englishBookNameNormalized = ptBookNameToEnBookName[normalizeBookName(bookNameOriginal)] || normalizeBookName(bookNameOriginal); // Normalize for lookup
                            const chapter = parseInt(paragraphDiv.getAttribute('data-chapter'));
                            const startVerse = parseInt(paragraphDiv.getAttribute('data-start-verse'));
                            const endVerse = parseInt(paragraphDiv.getAttribute('data-end-verse'));

                            const englishVersesInChapter = englishBibliaData.filter(
                                v => v.book_name === englishBookNameNormalized && v.chapter === chapter
                            );

                            const relevantEnglishVerses = englishVersesInChapter.filter(
                                v => v.verse >= startVerse && v.verse <= endVerse
                            );

                            let combinedEnglishHtml = '';
                            if (relevantEnglishVerses.length > 0) {
                                relevantEnglishVerses.forEach((engVerse) => {
                                    let verseContent = engVerse.text;
                                    verseContent = engVerse.text.replace(/<S>.*?<\/S>/gi, '');
                                    verseContent = verseContent.replace(/(\S+?)(\d+)/g, '$1');
                                    verseContent = verseContent.replace(/<J>(.*?)<\/J>/gi, '<span class="text-yellow-j">$1</span>');
                                    verseContent = verseContent.replace(/<pb\/>/gi, '<div class="mt-4"></div>');

                                    combinedEnglishHtml += `<span class="verse-number">${engVerse.verse}</span>${verseContent.trim()} `;
                                });
                            }

                            if (relevantEnglishVerses.length > 0) {
                                englishVerseContentDiv.innerHTML = combinedEnglishHtml.trim();
                                // Use the original English book name for display
                                const originalEnglishBookName = relevantEnglishVerses[0].original_book_name;
                                let referenceText = `${originalEnglishBookName} ${chapter}`;
                                if (startVerse && endVerse) {
                                    referenceText += `:${startVerse}`;
                                    if (startVerse !== endVerse) {
                                        referenceText += `-${endVerse}`;
                                    }
                                }
                                referenceText += ' (KJV)';
                                englishVerseReferenceDiv.textContent = referenceText;
                            } else {
                                englishVerseContentDiv.textContent = "Parágrafo correspondente não encontrado em inglês.";
                                englishVerseReferenceDiv.textContent = `(Buscando por ${englishBookNameNormalized} Cap ${chapter}, Versos ${startVerse}-${endVerse})`;
                            }
                            englishVerseModalOverlay.classList.add('visible');
                            event.preventDefault();
                            logDebugMessage(`[exibirVersiculos] Double clicked paragraph. Showing English modal.`, 'event');
                        }
                    });

                    paragraphContainer.appendChild(paragraphDiv);
                });
                versiculosDiv.appendChild(paragraphContainer);
                logDebugMessage(`[exibirVersiculos] Paragraph mode rendering complete.`, 'debug');

            } else { // Verse Mode
                logDebugMessage(`[exibirVersiculos] Verse Mode enabled.`, 'debug');
                 versiculos.forEach(verso => {
                    const div = document.createElement('div');
                    div.className = 'verse versiculo mb-2 p-3 rounded-lg shadow-sm';
                    div.setAttribute('data-verse-number', verso.verse);
                    div.setAttribute('data-book-name', verso.original_book_name); // Store original name
                    div.setAttribute('data-chapter', verso.chapter);
                    if (verso.book_number !== undefined) div.setAttribute('data-book-number', verso.book_number);
                    else logDebugMessage(`[exibirVersiculos] Versículo sem book_number: ${verso.original_book_name} ${verso.chapter}:${verso.verse}`, 'warn');

                    const verseContent = document.createElement('div');
                    verseContent.className = 'verse-content';

                    let verseTextContent = verso.text;
                    verseTextContent = verseTextContent.replace(/<S>.*?<\/S>/gi, '');
                    verseTextContent = verseTextContent.replace(/(\S+?)(\d+)/g, '$1');
                    verseTextContent = verseTextContent.replace(/<J>(.*?)<\/J>/gi, '<span class="text-yellow-j">$1</span>');
                    verseTextContent = verseTextContent.replace(/<pb\/>/gi, ''); // Changed from ' ' to ''

                    verseContent.innerHTML = `<span class="verse-number">${verso.verse}</span>${verseTextContent}`;
                    div.appendChild(verseContent);

                     div.addEventListener('click', (event) => {
                         if (event.ctrlKey) {
                              event.preventDefault();
                              const selection = window.getSelection();
                              if (selection) selection.removeAllRanges();

                              let clickedWord = null;
                              const verseElement = findAncestorWithClass(event.target, 'verse');

                              if (verseElement) {
                                  const caretPosition = document.caretPositionFromPoint(event.clientX, event.clientY);

                                  if (caretPosition && caretPosition.offsetNode && caretPosition.offsetNode.nodeType === Node.TEXT_NODE) {
                                      const textNode = caretPosition.offsetNode;
                                      const offset = caretPosition.offset;
                                      let text = textNode.textContent;

                                      text = text.replace(/<S>.*?<\/S>/gi, '');

                                      const wordCharRegex = (currentLanguage === 'pt') ? /[a-zA-ZÀ-ÖØ-öø-ÿ'-]/ : /[a-zA-Z'-]/;

                                      let start = offset;
                                      while (start > 0 && wordCharRegex.test(text[start - 1])) {
                                          start--;
                                      }

                                      let end = offset;
                                      while (end < text.length && wordCharRegex.test(text[end])) {
                                          end++;
                                      }

                                      clickedWord = text.substring(start, end);

                                      clickedWord = clickedWord.replace(/^[^\wÀ-ÖØ-öø-ÿ'-]+|[^\wÀ-ÖØ-öø-ÿ'-]+$/g, '');

                                      logDebugMessage(`[Ctrl+Click] Extracted word from text node: "${clickedWord}"`, 'debug');

                                      if (clickedWord) {
                                           if (currentLanguage === 'pt') {
                                               const cleanedClickedWord = removeAccents(clickedWord).toLowerCase();
                                               const sinonimoEntry = sinonimosData.find(entry =>
                                                   entry.keyword && removeAccents(entry.keyword).toLowerCase() === cleanedClickedWord
                                               );

                                               if (sinonimoEntry) {
                                                   logDebugMessage(`[Ctrl+Click] Sinônimo encontrado para "${clickedWord}".`, 'info');
                                                   sinonimosKeywordDiv.textContent = clickedWord;
                                                   sinonimosLinesList.innerHTML = '';
                                                   if (sinonimoEntry.lines && sinonimoEntry.lines.length > 0) {
                                                       sinonimoEntry.lines.forEach(line => {
                                                           const li = document.createElement('li');
                                                           li.textContent = line;
                                                           sinonimosLinesList.appendChild(li);
                                                       });
                                                   } else {
                                                       const li = document.createElement('li');
                                                       li.textContent = "Nenhuma informação adicional encontrada.";
                                                       sinonimosLinesList.appendChild(li);
                                                   }
                                                   showSinonimosModal();
                                               } else {
                                                   logDebugMessage(`[Ctrl+Click] Nenhum sinônimo encontrado para "${clickedWord}".`, 'info');
                                                   sinonimosKeywordDiv.textContent = clickedWord;
                                                   sinonimosLinesList.innerHTML = '';
                                                   const li = document.createElement('li');
                                                   li.textContent = "Nenhuma informação adicional encontrada para esta palavra.";
                                                   sinonimosLinesList.appendChild(li);
                                                   showSinonimosModal();
                                               }
                                           } else if (currentLanguage === 'en') {
                                                const etymonlineUrl = `https://www.etymonline.com/word/${encodeURIComponent(clickedWord)}`;
                                                window.open(etymonlineUrl, '_blank');
                                                logDebugMessage(`[Ctrl+Click] Opening Etymonline for: "${clickedWord}"`, 'info');
                                           }
                                      } else {
                                          logDebugMessage('[Ctrl+Click] Nenhuma palavra clicada identificada após extração.', 'warn');
                                      }
                                  } else {
                                      logDebugMessage('[Ctrl+Click] Não clicou em um nó de texto válido.', 'warn');
                                  }
                              } else {
                                  logDebugMessage('[Ctrl+Click] Elemento de versículo não encontrado para o clique.', 'warn');
                              }
                         } else if (event.shiftKey) {
                              const highlightedSpan = findAncestorWithClass(event.target, 'highlighted');
                              if (highlightedSpan) {
                                  removeHighlightSpan(highlightedSpan);
                                  logDebugMessage('[Shift+Click] Removed highlight.', 'event');
                              }
                         }
                     });
                     if (currentLanguage === 'pt') {
                         div.addEventListener('dblclick', (event) => {
                             const bookNumber = parseInt(div.getAttribute('data-book-number'));
                             const chapter = parseInt(div.getAttribute('data-chapter'));
                             const verseNum = parseInt(div.getAttribute('data-verse-number'));
                             // Find English verse using normalized book_name for lookup
                             const englishVerse = englishBibliaData.find(v => v.book_number === bookNumber && v.chapter === chapter && v.verse === verseNum);
                             if (englishVerse) {
                                 let englishVerseText = englishVerse.text;
                                 englishVerseText = englishVerseText.replace(/<S>.*?<\/S>/gi, '');
                                 englishVerseText = englishVerseText.replace(/(\S+?)(\d+)/g, '$1');
                                 englishVerseText = englishVerseText.replace(/<J>(.*?)<\/J>/gi, '<span class="text-yellow-j">$1</span>');
                                 englishVerseText = englishVerseText.replace(/<pb\/>/gi, ' ');

                                 englishVerseContentDiv.innerHTML = englishVerseText;
                                 // Use original_book_name for display
                                 englishVerseReferenceDiv.textContent = `${englishVerse.original_book_name} ${englishVerse.chapter}:${englishVerse.verse} (KJV)`;
                             } else {
                                  englishVerseContentDiv.textContent = "Versículo correspondente não encontrado em inglês.";
                                  englishVerseReferenceDiv.textContent = `(Buscando por Livro #${bookNumber}, Cap ${chapter}, Ver ${verso.verse})`;
                             }
                             englishVerseModalOverlay.classList.add('visible');
                             event.preventDefault();
                             logDebugMessage(`[exibirVersiculos] Double clicked verse. Showing English modal.`, 'event');
                         });
                     }

                    versiculosDiv.appendChild(div);
                 });
                 logDebugMessage(`[exibirVersiculos] Verse mode rendering complete.`, 'debug');
            }
          }

          const capitulosDoLivro = [...new Set(currentData.filter(v => v.book_name === normalizeBookName(livro)).map(v => v.chapter))].sort((a, b) => a - b);
          const indexCapituloAtual = capitulosDoLivro.indexOf(capitulo);

          const livrosAtualIndex = livros.indexOf(livro); // Get the index of the current book (original name)

          // Declare buttons at the top of the function scope
          const prevButton = document.createElement('span');
          const nextButton = document.createElement('span');
          const navContainer = document.createElement('div');

          let capituloAnterior = null;
          let capituloSeguinte = null;
          let prevBookOriginalName = null;
          let nextBookOriginalName = null;
          // let lastChapterOfPrevBook = null; // This variable is no longer needed for the "Previous Book" logic

          // Logic for "Previous" button
          prevButton.className = 'chapter-nav-button'; // Apply base class
          if (indexCapituloAtual > 0) {
              capituloAnterior = capitulosDoLivro[indexCapituloAtual - 1];
              prevButton.textContent = currentLanguage === 'pt' ? '← Anterior' : '← Previous';
              prevButton.classList.remove('disabled');
              prevButton.onclick = () => {
                  const activeTab = abertoTabs.find(tab => tab.id === activeTabId);
                  if (activeTab) {
                      activeTab.scrollToVerse = null;
                       abrirLivroNoCentro(livroAtual, capituloAnterior, 'nav-button', activeTabId, false, null);
                  } else {
                       abrirLivroNoCentro(livroAtual, capituloAnterior, 'nav-button', null, false, null);
                  }
                  logDebugMessage(`[exibirCapitulos] Navigated to previous chapter: ${capituloAnterior}.`, 'event');
              };
          } else { // First chapter of the current book
              const prevBookIndex = livrosAtualIndex - 1;
              if (prevBookIndex >= 0) {
                  prevBookOriginalName = livros[prevBookIndex];
                  // The change is here: always go to chapter 1 of the previous book
                  prevButton.textContent = currentLanguage === 'pt' ? '← Livro Anterior' : '← Previous Book';
                  prevButton.classList.remove('disabled');
                  prevButton.onclick = () => {
                      const activeTab = abertoTabs.find(tab => tab.id === activeTabId);
                      if (activeTab) {
                          activeTab.scrollToVerse = null;
                          abrirLivroNoCentro(prevBookOriginalName, 1, 'nav-button', activeTabId, false, null); // Changed to 1
                      } else {
                          abrirLivroNoCentro(prevBookOriginalName, 1, 'nav-button', null, false, null); // Changed to 1
                      }
                      logDebugMessage(`[exibirCapitulos] Navigated to previous book: ${prevBookOriginalName} chapter 1.`, 'event');
                  };
              } else {
                  prevButton.classList.add('disabled');
              }
          }

          // Logic for "Next" button
          nextButton.className = 'chapter-nav-button'; // Apply base class
          if (indexCapituloAtual < capitulosDoLivro.length - 1) {
              capituloSeguinte = capitulosDoLivro[indexCapituloAtual + 1];
              nextButton.textContent = currentLanguage === 'pt' ? 'Próximo →' : 'Next →';
              nextButton.classList.remove('disabled');
              nextButton.onclick = () => {
                  const activeTab = abertoTabs.find(tab => tab.id === activeTabId);
                  if (activeTab) {
                      activeTab.scrollToVerse = null;
                       abrirLivroNoCentro(livroAtual, capituloSeguinte, 'nav-button', activeTabId, false, null);
                  } else {
                       abrirLivroNoCentro(livroAtual, capituloSeguinte, 'nav-button', null, false, null);
                  }
                  logDebugMessage(`[exibirCapitulos] Navigated to next chapter: ${capituloSeguinte}.`, 'event');
              };
          } else { // Last chapter of the current book
              const nextBookIndex = livrosAtualIndex + 1;
              if (nextBookIndex < livros.length) {
                  nextBookOriginalName = livros[nextBookIndex];
                  nextButton.textContent = currentLanguage === 'pt' ? 'Próximo Livro →' : 'Next Book →';
                  nextButton.classList.remove('disabled');
                  nextButton.onclick = () => {
                      const activeTab = abertoTabs.find(tab => tab.id === activeTabId);
                      if (activeTab) {
                          activeTab.scrollToVerse = null;
                          abrirLivroNoCentro(nextBookOriginalName, 1, 'nav-button', activeTabId, false, null);
                      } else {
                          abrirLivroNoCentro(nextBookOriginalName, 1, 'nav-button', null, false, null);
                      }
                      logDebugMessage(`[exibirCapitulos] Navigated to next book: ${nextBookOriginalName} chapter 1.`, 'event');
                  };
              } else {
                  nextButton.classList.add('disabled');
              }
          }

          navContainer.className = 'flex justify-between mt-4';
          navContainer.appendChild(prevButton);
          navContainer.appendChild(nextButton);
          versiculosDiv.appendChild(navContainer);

          livroState[livro] = livroState[livro] || {};
          livroState[livro].currentChapter = capitulo;

          const capituloBotoes = capitulosContainer.querySelectorAll('.capitulo');
          capituloBotoes.forEach(botao => {
              botao.classList.remove('active');
          });
          const botaoAtivo = Array.from(capituloBotoes).find(b => parseInt(b.textContent) === capitulo);
          if (botaoAtivo) botaoAtivo.classList.add('active');
          logDebugMessage(`[exibirVersiculos] Botão de capítulo ativo para ${capitulo} marcado.`, 'debug');

          // Return a Promise that resolves after the setTimeout
          return new Promise(resolve => {
              setTimeout(() => {
                  if (conteudoDiv) {
                      conteudoDiv.style.scrollBehavior = 'auto';
                      let scrolled = false;

                      logDebugMessage(`[exibirVersiculos - Scroll Logic] Livro: ${livro}, Capítulo: ${capitulo}`, 'debug');
                      logDebugMessage(`[exibirVersiculos - Scroll Logic] restoreScroll: ${restoreScroll}`, 'debug');
                      logDebugMessage(`[exibirVersiculos - Scroll Logic] livroState[${livro}] state: ${JSON.stringify(livroState[livro])}`, 'debug');
                      logDebugMessage(`[exibirVersiculos - Scroll Logic] verseToHighlight: ${verseToHighlight}`, 'debug');

                      let savedScrollTop = 0;
                      const activeTab = abertoTabs.find(tab => tab.id === activeTabId);
                      if (activeTab && activeTab.scrollTop !== undefined) {
                           savedScrollTop = activeTab.scrollTop;
                           logDebugMessage(`[exibirVersiculos - Scroll Logic] Found saved scrollTop for active tab (ID: ${activeTabId}): ${savedScrollTop}`, 'debug');
                       } else {
                           logDebugMessage(`[exibirVersiculos - Scroll Logic] No saved scrollTop found for active tab (ID: ${activeTabId}).`, 'debug');
                       }

                      if (verseToHighlight !== null && verseToHighlight !== undefined) {
                          let targetElement = null;
                          if (paragraphMode) {
                              // Find the paragraph that contains the verseToHighlight
                              const allParagraphs = versiculosDiv.querySelectorAll('.paragraph');
                              for (const paragraphDiv of allParagraphs) {
                                  const startVerse = parseInt(paragraphDiv.getAttribute('data-start-verse'));
                                  const endVerse = parseInt(paragraphDiv.getAttribute('data-end-verse'));
                                  if (verseToHighlight >= startVerse && verseToHighlight <= endVerse) {
                                      targetElement = paragraphDiv;
                                      break;
                                  }
                              }
                          } else { // Verse Mode
                              targetElement = versiculosDiv.querySelector(`.verse[data-verse-number="${verseToHighlight}"]`);
                          }

                          if (targetElement) {
                               targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                               logDebugMessage(`[exibirVersiculos] Scrolling to target element for verse ${verseToHighlight}.`, 'info');

                               targetElement.classList.add('highlight-animation');
                               setTimeout(() => {
                                   targetElement.classList.remove('highlight-animation');
                                   const currentActiveTab = abertoTabs.find(tab => tab.id === activeTabId);
                                   if (currentActiveTab) {
                                       currentActiveTab.scrollToVerse = null;
                                       logDebugMessage(`[exibirVersiculos - Scroll Logic] Cleared scrollToVerse for tab (ID: ${currentActiveTab.id}) after animation.`, 'debug');
                                   }
                                   verseToRestoreOnModeChange = null; // Clear after use
                                   logDebugMessage(`[exibirVersiculos - Scroll Logic] Cleared verseToRestoreOnModeChange.`, 'debug');
                               }, 500);

                               scrolled = true;
                          } else {
                              logDebugMessage(`[exibirVersiculos] Target element for verse ${verseToHighlight} not found.`, 'warn');
                          }
                      }

                      if (!scrolled && restoreScroll && activeTab && activeTab.scrollTop !== undefined) {
                          logDebugMessage(`[exibirVersiculos] Attempting to restore scroll from active tab (ID: ${activeTabId}). Saved scrollTop: ${activeTab.scrollTop}`, 'debug');
                          conteudoDiv.scrollTop = activeTab.scrollTop;
                          logDebugMessage(`[exibirVersiculos] Restored scroll position from active tab: ${conteudoDiv.scrollTop}`, 'info');
                          scrolled = true;
                       }
                       else if (!scrolled && restoreScroll && livroState[livro] && livroState[livro].scrollTop !== undefined) {
                           logDebugMessage(`[exibirVersiculos] Attempting to restore scroll from livroState for ${livro}. Saved scrollTop: ${livroState[livro].scrollTop}`, 'debug');
                           conteudoDiv.scrollTop = livroState[livro].scrollTop;
                           logDebugMessage(`[exibirVersiculos] Restored scroll position from livroState: ${conteudoDiv.scrollTop}`, 'info');
                           scrolled = true;
                       }

                      if (!scrolled) {
                           conteudoDiv.scrollTop = 0;
                           logDebugMessage(`[exibirVersiculos] No scroll position to restore or verse to scroll to, scrolling to top.`, 'info');
                      }

                      // Re-enable language toggle button AFTER content is displayed and scrolled
                      if (source === 'language-toggle' || source === 'tab-click') {
                          languageToggleButton.disabled = false;
                          logDebugMessage(`[exibirVersiculos] Language toggle button re-enabled after content displayed and scrolled.`, 'debug');
                      }
                  }
                  resolve(); // Resolve the promise after all rendering and scrolling logic
              }, 50);
          });

          // Update main heading to show book name and chapter
          updateMainHeading(livro, capitulo); // 'livro' is original accented name
          pageTitle.textContent = `${livro} - ${capitulo}`;
          logDebugMessage(`[exibirVersiculos] Page title and mainHeading updated.`, 'debug');
      } catch (e) {
           logDebugMessage(`[exibirVersiculos] Error: ${e.message}`, 'error');
           versiculosDiv.innerHTML = `<p class="text-red-500">Erro ao exibir versículos.</p>`;
           if (source === 'language-toggle' || source === 'tab-click') { // Re-enable button on error within exibirVersiculos
                languageToggleButton.disabled = false;
                logDebugMessage(`[exibirVersiculos] Language toggle button re-enabled due to error in rendering.`, 'debug');
            }
      }
    }

    function fecharLivroAberto(tabId) {
      logDebugMessage(`[fecharLivroAberto] Attempting to close tab with ID: ${tabId}`, 'event');
      try {
          const tabIndexToRemove = abertoTabs.findIndex(tab => tab.id === tabId);
          if (tabIndexToRemove !== -1) {
              const removedTab = abertoTabs.splice(tabIndexToRemove, 1)[0];
              logDebugMessage(`[fecharLivroAberto] Tab removed: ${JSON.stringify(removedTab)}`, 'debug');
              let isDesktop = window.matchMedia('(min-width: 769px)').matches; // Alterado de const para let
              if (isDesktop) {
                  if (removedTab.id === activeTabId) {
                      logDebugMessage(`[fecharLivroAberto] Active tab closed.`, 'info');
                      if (abertoTabs.length > 0) {
                          const lastTab = abertoTabs[abertoTabs.length - 1];
                          logDebugMessage(`[fecharLivroAberto] Opening last tab: ${JSON.stringify(lastTab)}`, 'info');
                          abrirLivroNoCentro(lastTab.book, lastTab.chapter, 'tab-click', lastTab.id, true, lastTab.scrollToVerse);
                      } else {
                          logDebugMessage(`[fecharLivroAberto] No open tabs, clearing content.`, 'info');
                          document.getElementById('capitulosContainer').innerHTML = '';
                          document.getElementById('versiculos').innerHTML = '';

                          initialMessageDiv.classList.remove('hidden');
                          capitulosContainer.classList.add('hidden');
                          versiculosDiv.classList.add('hidden'); // Use global versiculosDiv


                          livroAtual = null; activeTabId = null;
                          updateMainHeading(null, null); // Reset main heading
                          logDebugMessage(`[fecharLivroAberto] State after closing last tab: livroAtual=${livroAtual}, activeTabId=${activeTabId}`, 'debug');
                          for (const book in livroState) if (livroState[book]) delete livroState[book].scrollTop;
                      }
                  }
                  atualizarPainelAbertos();
              } else {
                   if (removedTab.id === activeTabId && abertoTabs.length === 0) {
                       logDebugMessage(`[fecharLivroAberto] Mobile: Active tab closed and no other tab open, clearing content.`, 'info');
                       document.getElementById('capitulosContainer').innerHTML = '';
                       document.getElementById('versiculos').innerHTML = '';

                       initialMessageDiv.classList.remove('hidden');
                       capitulosContainer.classList.add('hidden');
                       versiculosDiv.classList.add('hidden'); // Use global versiculosDiv

                       livroAtual = null; activeTabId = null;
                       updateMainHeading(null, null); // Reset main heading
                       logDebugMessage(`[fecharLivroAberto] Mobile State after closing last tab: livroAtual=${livroAtual}, activeTabId=${activeTabId}`, 'debug');
                       for (const book in livroState) if (livroState[book]) delete livroState[book].scrollTop;
                   }
              }
          }
      } catch (e) {
           logDebugMessage(`[fecharLivroAberto] Erro: ${e.message}`, 'error');
           let isDesktop3 = window.matchMedia('(min-width: 769px)').matches; // Alterado de const para let
           if (isDesktop3) {
               document.getElementById('favoritos').innerHTML = `<h4 class="font-semibold mb-4">Abertos</h4><p class="text-red-500">Erro ao fechar livro.</p>`;
           }
      }
    }

    function atualizarPainelAbertos() {
      const container = document.getElementById('favoritos');
      let isDesktop = window.matchMedia('(min-width: 769px)').matches; // Alterado de const para let
      if (!isDesktop) {
          logDebugMessage(`[atualizarPainelAbertos] Not desktop, skipping panel update.`, 'debug');
          return;
      }

      abertoTabsContainer.innerHTML = '';

      try {
          let hiddenForcer = document.getElementById('hidden-width-forcer');
          if (!hiddenForcer) {
              hiddenForcer = document.createElement('span');
              hiddenForcer.id = 'hidden-width-forcer';
              container.appendChild(hiddenForcer);
          }
          hiddenForcer.textContent = getLongestBookName(currentLanguage) + ' ';

          if (abertoTabs.length === 0) {
              logDebugMessage(`[atualizarPainelAbertos] Não há abas abertas.`, 'info');
              return;
          }

          logDebugMessage(`[atualizarPainelAbertos] Atualizando painel com ${abertoTabs.length} abas: ${JSON.stringify(abertoTabs)}`, 'debug');

          abertoTabs.forEach(tab => { // tab.book is the original accented name
            const div = document.createElement('div');
            div.className = 'aba-livro';
            div.setAttribute('draggable', true);
            div.setAttribute('data-tab-id', tab.id);
            if (tab.id === activeTabId) div.classList.add('active-aba');

            div.addEventListener('dragstart', (e) => {
                draggedItem = div; e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', tab.id);
                setTimeout(() => div.classList.add('dragging'), 0);
                logDebugMessage(`[atualizarPainelAbertos] Drag start for tab ID: ${tab.id}`, 'event');
            });
            div.addEventListener('dragover', (e) => {
                e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                const targetItem = e.target.closest('.aba-livro');
                if (targetItem && targetItem !== draggedItem) {
                    const targetItemId = parseInt(targetItem.getAttribute('data-tab-id'));
                    const draggedItemId = parseInt(draggedItem.getAttribute('data-tab-id'));
                    const targetIndex = abertoTabs.findIndex(t => t.id === targetItemId);
                    const draggedIndex = abertoTabs.findIndex(t => t.id === draggedItemId);
                    if (targetIndex !== -1 && draggedIndex !== -1) {
                        const [movedItem] = abertoTabs.splice(draggedIndex, 1);
                        const rect = targetItem.getBoundingClientRect();
                        const middleY = rect.top + rect.height / 2;
                        if (e.clientY < middleY) {
                            abertoTabs.splice(targetIndex, 0, movedItem);
                            abertoTabsContainer.insertBefore(draggedItem, targetItem);
                        } else {
                            abertoTabs.splice(targetIndex + 1, 0, movedItem);
                            abertoTabsContainer.insertBefore(draggedItem, targetItem.nextSibling);
                        }
                        logDebugMessage(`[atualizarPainelAbertos] Drag over: Reordered tabs.`, 'debug');
                    }
                }
            });
            div.addEventListener('dragend', () => {
                if(draggedItem) draggedItem.classList.remove('dragging');
                draggedItem = null;
                // REMOVED: atualizarPainelAbertos(); // This rebuilds the entire panel and likely reverts visual changes
                logDebugMessage(`[atualizarPainelAbertos] Drag end.`, 'event');
            });

            const spanNome = document.createElement('span');
            spanNome.textContent = `${tab.book}${tab.chapter ? ' ' + tab.chapter : ''}`; // tab.book is original name
            spanNome.className = 'flex-grow';
            const fechar = document.createElement('span');
            fechar.textContent = '✖';
            fechar.className = 'fechar cursor-pointer';
            div.onclick = () => {

          });
           logDebugMessage(`[atualizarPainelAbertos] Painel 'Abertos' atualizado.`, 'info');

    function getLongestBookName(language) {
        try {
             let currentData = (language === 'pt') ? bibliaData : englishBibliaData;
             if (!currentData || currentData.length === 0) return "Nome Longo Padrão";
             let bookNames = new Set();
             // Use original_book_name to find the longest name for display purposes
             bookNames = new Set(currentData.map(v => v.original_book_name));
             return [...bookNames].reduce((l, b) => b.length > l.length ? b : l, '');
        } catch (e) { logDebugMessage(`[getLongestBookName] Erro: ${e.message}`, 'error'); return "Nome Longo Padrão"; }
    }

    function performSearch(query, scope = currentSearchScope) { // Removed searchTermOverride, use query directly
        logDebugMessage(`[performSearch] Iniciando busca para o termo: "${query}" no escopo: "${scope}"`, 'event');
        const lowerCaseQuery = query.toLowerCase(); // Use lowerCaseQuery here
        searchResultsContainer.innerHTML = '';

        if (query.length < 2) {
            searchResultsContainer.innerHTML = '<p>Digite pelo menos 2 caracteres.</p>';
            showSearchModal(); highlightFilterButton(scope); updateFilterCounts(0,0,0);
            logDebugMessage(`[performSearch] Termo de busca muito curto.`, 'warn');
            return;
        }

        let currentData = (currentLanguage === 'pt') ? bibliaData : englishBibliaData;
         if (!currentData || currentData.length === 0) {
             searchResultsContainer.innerHTML = `<p class="text-red-500">Dados (${currentLanguage}) não disponíveis.</p>`;
             showSearchModal(); updateFilterCounts(0,0,0);
             logDebugMessage(`[performSearch] Dados (${currentLanguage}) não carregados para busca. Aborting.`, 'error');
             return;
         }
        try {
            const searchTermWithoutAccents = removeAccents(lowerCaseQuery);
            // Filter using normalized book_name for consistency with internal data
            let allResults = currentData.filter(v => v.text && removeAccents(v.text.toLowerCase()).includes(searchTermWithoutAccents));
            const ntBooksNormalized = newTestamentBooksByLanguage[currentLanguage]; // NT book names are normalized
            let newResults = allResults.filter(v => ntBooksNormalized.includes(v.book_name)); // v.book_name is normalized
            let oldResults = allResults.filter(v => !ntBooksNormalized.includes(v.book_name)); // v.book_name is normalized

            logDebugMessage(`[performSearch] Resultados encontrados: Total=${allResults.length}, NT=${newResults.length}, AT=${oldResults.length}`, 'info');

            updateFilterCounts(newResults.length, oldResults.length, allResults.length);

            let resultsToDisplay = (scope === 'new') ? newResults : (scope === 'old') ? oldResults : allResults;

            if (resultsToDisplay.length === 0) {
                searchResultsContainer.innerHTML = '<p>Nenhum versículo encontrado.</p>';
                logDebugMessage(`[performSearch] Nenhum resultado para exibir no escopo ${scope}.`, 'info');
            } else {
                logDebugMessage(`[performSearch] Exibindo ${resultsToDisplay.length} resultados para o escopo ${scope}.`, 'info');
                resultsToDisplay.forEach(verso => {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'verse-result';
                    const verseInfo = document.createElement('div');
                    verseInfo.className = 'verse-info';
                    const highlightPattern = buildAccentInsensitiveRegexPattern(query); // Use 'query' for highlighting
                    const highlightRegex = new RegExp(highlightPattern, 'gi');
                    let highlightedText = verso.text.replace(highlightRegex, match => `<strong>${match}</strong>`);
                    highlightedText = highlightedText.replace(/<S>.*?<\/S>/gi, '');
                    highlightedText = highlightedText.replace(/(\S+?)(\d+)/g, '$1');
                    highlightedText = highlightedText.replace(/<J>(.*?)<\/J>/gi, '<span class="text-yellow-j">$1</span>');
                    highlightedText = highlightedText.replace(/<pb\/>/gi, ''); // Changed from ' ' to ''

                    // Use original_book_name for abbreviation and display
                    const abbreviatedBook = abbreviateBookName(verso.original_book_name);
                    verseInfo.innerHTML = `<span class="abbreviated-book-name">${abbreviatedBook}</span> <span class="chapter-verse-ref">${verso.chapter}:${verso.verse}</span> - ${highlightedText}`;

                    const openButton = document.createElement('button');
                    openButton.textContent = currentLanguage === 'pt' ? 'Abrir' : 'Open';
                    openButton.className = 'open-verse-button';
                    openButton.onclick = () => {
                        const bookToOpen = verso.original_book_name; // Pass original name to abrirLivroNoCentro
                        const chapterToOpen = verso.chapter;
                        const verseToScrollTo = verso.verse;

                        abrirLivroNoCentro(bookToOpen, chapterToOpen, 'search', null, true, verseToScrollTo);
                        logDebugMessage(`[performSearch] Clicked "Abrir" for ${bookToOpen} ${chapterToOpen}:${verseToScrollTo}.`, 'event');
                    };
                    resultDiv.appendChild(verseInfo); resultDiv.appendChild(openButton);
                    searchResultsContainer.appendChild(resultDiv);
                });
            }
            showSearchModal(); highlightFilterButton(scope); currentSearchScope = scope;
            modalSearchInput.value = query; // Use query here
            logDebugMessage(`[performSearch] Modal de busca exibido.`, 'debug');
        } catch (e) {
            logDebugMessage(`[performSearch] Erro: ${e.message}`, 'error');
            searchResultsContainer.innerHTML = `<p class="text-red-500">Erro na busca.</p>`; showSearchModal();
        }
    }

    document.addEventListener('mouseup', (event) => {
        if (event.shiftKey && event.button === 0) {
            const selection = window.getSelection();
            if (selection && !selection.isCollapsed && selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                const firstVerseElement = findAncestorWithClass(range.startContainer, 'verse');
                const lastVerseElement = findAncestorWithClass(range.endContainer, 'verse');
                if (firstVerseElement && lastVerseElement && firstVerseElement === lastVerseElement) {
                    let anyHighlighted = false;
                    const walker = document.createTreeWalker(firstVerseElement, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT,
                        { acceptNode: (node) => range.intersectsNode(node) && ((node.nodeType === Node.ELEMENT_NODE && node.classList.contains('highlighted')) || (node.nodeType === Node.TEXT_NODE && findAncestorWithClass(node, 'highlighted'))) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP }, false);
                    let node; while(node = walker.nextNode()) anyHighlighted = true;

                    if (anyHighlighted) {
                        const spansToRemove = new Set();
                        const spanWalker = document.createTreeWalker(firstVerseElement, NodeFilter.SHOW_ELEMENT,
                            { acceptNode: (node) => node.classList.contains('highlighted') && range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP }, false);
                        let spanNode; while(spanNode = spanWalker.nextNode()) spansToRemove.add(spanNode);
                        spansToRemove.forEach(span => removeHighlightSpan(span));
                        logDebugMessage('[mouseup] Shift+Click: Removed highlight from selected area.', 'event');
                    } else {
                        try { applyHighlightSpan(range); logDebugMessage('[mouseup] Shift+Click: Applied highlight to selected area.', 'event'); } catch (e) { logDebugMessage(`[mouseup] Erro ao destacar: ${e.message}`, 'error'); }
